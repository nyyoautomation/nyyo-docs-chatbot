<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nyyo chat embed example</title>
</head>
<body style="font-family:system-ui;background:#0b1220;color:#e8eefc;padding:40px">
  <h1>Your site content…</h1>
  <p>The floating chatbot button is injected by the script below. Works on Wix, Webflow (custom code), and any HTML host.</p>
  <!-- Free install kit — paste before </body> -->
  <script
    src="./nyyo-chat.js"
    data-bot-url="https://nyyoautomation.github.io/nyyo-docs-chatbot/"
    data-label="Ask docs"
    data-position="bottom-right"
    defer></script>
</body>
</html>
